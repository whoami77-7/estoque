<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="color-scheme" content="dark">
  <title>Deshboard do Puff</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <div class="preview-notice" id="connection-status" role="status">Conectando ao seu painel…</div>
  <a class="skip-link" href="#content">Ir para o conteúdo</a>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <img class="brand-icon" src="icon.svg" width="48" height="48" alt="">
        <div class="brand-copy">
          <strong>Deshboard do Puff</strong>
          <span>Seu controle, do seu jeito.</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="refresh" class="ghost" type="button">↻ Atualizar</button>
        <button id="reconcile" class="secondary" type="button" hidden>Conferir operação</button>
        <button id="export-backup" class="secondary" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg><span>Backup</span></button>
      </div>
    </header>

    <nav class="tabs" aria-label="Seções do painel">
      <button type="button" data-view="estoque" class="active" aria-current="page">📦 Estoque</button>
      <button type="button" data-view="vendas">💸 Vendas</button>
      <button type="button" data-view="mercadorias" class="new-module">🛍️ Mercadorias <span class="new-label">Novo</span></button>
      <button type="button" data-view="devedores" class="new-module">🤝 Devedores <span class="new-label">Novo</span></button>
      <button type="button" data-view="receber">💰 A receber</button>
      <button type="button" data-view="gastos">🧾 Gastos</button>
      <button type="button" data-view="clientes">👥 Clientes</button>
      <button type="button" data-view="locais">📍 Locais</button>
      <button type="button" data-view="decisao" class="decision-tab">✨ Tomada de decisão</button>
    </nav>

    <main>
      <div class="toolbar">
        <div class="page-heading">
          <h1 id="page-title">Estoque</h1>
          <p id="page-description">Estoque principal e mercadorias, com cada detalhe à mão.</p>
        </div>
        <button id="new-entry" type="button" class="primary"><span aria-hidden="true">+</span> Novo produto</button>
      </div>

      <section id="summary" aria-label="Resumo"></section>

      <div class="filter-bar">
        <label class="search-field" for="search">
          <span class="sr-only">Buscar produto, cliente ou observação</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg>
          <input id="search" type="search" placeholder="Buscar produto, cliente ou observação" autocomplete="off">
        </label>
        <label class="stock-field" for="stock-filter">
          <span>Estoque</span>
          <select id="stock-filter">
            <option value="">Todos</option>
            <option value="principal">Principal</option>
            <option value="mercadorias">Mercadorias</option>
          </select>
        </label>
        <label class="category-field" for="category-filter"><span>Categoria</span><select id="category-filter"><option value="">Todas</option><option value="peptideos">Peptídeos</option><option value="ar-condicionados">Ar-condicionados</option><option value="mercadorias">Mercadorias</option></select></label>
        <label class="location-field" for="location-filter">
          <span>Local</span>
          <select id="location-filter">
            <option value="all">Todos os locais</option>
            <option value="Loja">Loja</option>
            <option value="Depósito SP">Depósito SP</option>
          </select>
        </label>
      </div>

      <div id="content" tabindex="-1"></div>
    </main>
    <footer class="app-footer"><div class="footer-tools"><a href="legacy.html">Versão anterior e arquivados</a><button id="change-key" class="ghost" type="button">Chave de acesso</button><button id="sound-toggle" class="ghost" type="button" aria-pressed="true">♪ Som ligado</button></div><button id="alisson-balance" class="alisson-balance ghost" type="button" aria-label="Saldo informativo do Alisson">☕ Alisson <strong>US$ 0,00</strong></button><p class="help" id="last-sync"></p></footer>
  </div>

  <dialog id="editor" aria-labelledby="dialog-title">
    <form id="editor-form">
      <header class="dialog-header">
        <h2 id="dialog-title">Nova mercadoria</h2>
        <button id="close-dialog" class="ghost icon-button" type="button" aria-label="Fechar janela">×</button>
      </header>
      <div id="dialog-fields"></div>
      <p id="form-error" role="alert"></p>
      <footer class="dialog-footer">
        <button id="cancel-dialog" class="secondary" type="button">Cancelar</button>
        <button id="save-dialog" class="primary" type="submit">Salvar</button>
      </footer>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
